version: '3.8'

services:
  veridoc-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veridoc-api
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - DATABASE_URL=sqlite:////app/data/veridoc.db
      - PYTHONUNBUFFERED=1
    volumes:
      - veridoc-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  veridoc-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veridoc-frontend
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - API_BASE_URL=http://veridoc-api:8000
      - DATABASE_URL=sqlite:////app/data/veridoc.db
      - PYTHONUNBUFFERED=1
    volumes:
      - veridoc-data:/app/data
    depends_on:
      veridoc-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  veridoc-data:
    driver: local
