[project]
name = "veridoc"
version = "0.1.0"
description = "VeriDoc — AI Document Intelligence & Verification Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.23.0",
    "streamlit>=1.32.0",
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Fast isolated unit tests for individual functions and classes",
    "integration: Multi-component integration tests",
    "api: FastAPI REST API endpoint tests",
    "frontend: Streamlit UI tests",
    "slow: Computationally heavy tests (e.g. real embedding inference)",
    "security: Tests verifying secrets exclusion and database isolation",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["backend", "frontend"]
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
precision = 1
