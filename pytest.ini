[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Fast isolated unit tests for individual functions and classes
    integration: Multi-component integration tests
    api: FastAPI REST API endpoint tests
    frontend: Streamlit UI tests
    slow: Computationally heavy tests (e.g. real embedding inference)
    security: Tests verifying secrets exclusion and database isolation
filterwarnings =
    ignore::starlette.testclient.StarletteDeprecationWarning
    ignore::DeprecationWarning:starlette.*
